name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          BETTER_AUTH_SECRET: ci-only-secret-not-for-production-000000000001
          JOB_CRON_SECRET: ci-only-cron-secret-not-for-production-0000001
          APP_ENCRYPTION_KEY: ci-only-encryption-key-not-for-production-0001
      - run: pnpm audit --audit-level=high
        continue-on-error: true
