# OPTIONAL convenience for self-hosting. Kobolar does not require Docker:
# it runs on Vercel, Netlify and Cloudflare without any container.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kobolar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: kobolar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kobolar"]
      interval: 10s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kobolar:${POSTGRES_PASSWORD:-change-me}@db:5432/kobolar
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      BETTER_AUTH_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      JOB_CRON_SECRET: ${JOB_CRON_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    command: sh -c "pnpm db:migrate && pnpm start"

volumes:
  pgdata:
