[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Schedule the job processor every 5 minutes. Set JOB_CRON_SECRET as an
# environment variable in Netlify and keep the secret out of source control.
# See deploy/NETLIFY.md for the scheduled function that calls /api/cron/tick.
